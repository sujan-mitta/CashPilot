name: CI

on:
  push:
    branches:
      - main
      - sujan
  pull_request:
    branches:
      - main

# Runs with no secrets, and must stay that way. The unit suite mocks the
# database and the production build needs no live connection, so a fork's pull
# request gets the same verification as a push without ever seeing a
# credential. Adding a real DATABASE_URL here would buy nothing and hand every
# contributor the keys.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # A placeholder that is never connected to, and deliberately not a secret.
      #
      # `next build` collects page data by importing every route, and
      # src/lib/prisma.ts throws at module load when DATABASE_URL is absent.
      # That eager check is right — an app booting without a database should
      # fail loudly rather than at the first query — so the build needs a
      # connection STRING, not a database. Nothing here opens a connection:
      # the unit suite mocks Prisma and the build never executes a query.
      #
      # Putting a real URL here would hand every fork's pull request a
      # credential and buy nothing.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/cashpilot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
